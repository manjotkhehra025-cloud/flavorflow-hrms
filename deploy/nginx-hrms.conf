# Copy to /etc/nginx/sites-available/hrms, then:
#   sudo ln -s /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   sudo nginx -t && sudo systemctl reload nginx
# Then get SSL (best: run AFTER DNS points here):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d hr.flavorflow.co.in

server {
    listen 80;
    server_name hr.flavorflow.co.in;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket / streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
