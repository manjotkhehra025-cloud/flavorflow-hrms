name: flavorflow_hrms
description: Native Flutter HRMS for FlavorFlow, with API-driven RBAC and GPS attendance.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
