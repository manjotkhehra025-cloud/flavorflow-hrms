# CircleCI pipeline: build → deploy to GCP VPS on every push to main.
#
# Required project env vars (CircleCI → Project Settings → Environment Variables):
#   VPS_HOST   = external static IP of your GCP VM
#   VPS_USER   = SSH username on the VM (e.g. "deploy" or your gcloud username)
# SSH key: CircleCI → Project Settings → SSH Keys → add the private key whose
# PUBLIC key is in  /home/$VPS_USER/.ssh/authorized_keys  on the VM, and put its
# FINGERPRINT below (replace ADD_YOUR_SSH_KEY_FINGERPRINT_HERE).

version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - restore_cache:
          key: hrms-npm-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: hrms-npm-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx next build
      # Assemble the standalone server bundle the VPS actually runs:
      - run: |
          set -e
          [ -d public ] && cp -r public .next/standalone/public || true
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r prisma .next/standalone/prisma
          mkdir -p .next/standalone/scripts
          cp scripts/start.sh scripts/post-deploy.sh .next/standalone/scripts/
      - persist_to_workspace:
          root: .
          paths: [.next/standalone]

  deploy:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - add_ssh_keys:
          fingerprints:
            - "SHA256:FM6hR12F1M0wsgOBj/YpWf6NeiOX0inuEqccY8aNBPY"
      - run:
          name: Trust VPS host key
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - run:
          name: Install rsync
          command: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - run:
          name: Sync build to VPS
          command: |
            rsync -az ./.next/standalone/ "$VPS_USER@$VPS_HOST:/tmp/hrms-$CIRCLE_SHA1/"
            ssh "$VPS_USER@$VPS_HOST" "
              set -e
              sudo find /opt/hrms/app -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
              sudo cp -a /tmp/hrms-$CIRCLE_SHA1/. /opt/hrms/app/
              rm -rf /tmp/hrms-$CIRCLE_SHA1
            "
      - run:
          name: Run migrations & restart app
          command: |
            ssh "$VPS_USER@$VPS_HOST" 'sudo bash /opt/hrms/app/scripts/post-deploy.sh'

  # ── Native Android wrapper (Capacitor shell around the live app) ──
  build-android:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          key: gradle-{{ checksum "android/build.gradle" }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
      - run: npm ci
      - run: npx cap sync android
      - run:
          name: Assemble debug APK
          working_directory: android
          command: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
      - save_cache:
          key: gradle-{{ checksum "android/build.gradle" }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
          paths: [~/.gradle]
      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: HRMate.apk

  # ── Flutter native app (HRMate) ──
  build-flutter:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium+
    steps:
      - checkout
      - restore_cache:
          key: flutter-sdk-stable-v1
      - run:
          name: Install Flutter SDK (stable)
          command: |
            if [ ! -d "$HOME/flutter/bin" ]; then
              git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
            fi
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
            . "$BASH_ENV"
            flutter config --no-analytics || true
            flutter --version
      - save_cache:
          key: flutter-sdk-stable-{{ epoch }}
          paths: [~/flutter]
      - run:
          name: Generate Android wrapper + resolve deps
          working_directory: apps/hrmate_flutter
          command: |
            . "$BASH_ENV"
            flutter create . --project-name hrmate --org in.flavorflow --platforms=android
            # Belt & braces: if `flutter create` ever (re)drops its stock template
            # test (references a MyApp() call we don't have), remove it pre-analyze.
            if [ -f test/widget_test.dart ] && grep -q "MyApp()" test/widget_test.dart; then rm -f test/widget_test.dart; fi
            # minSdk 24, permissions, FlutterFragmentActivity (biometric), heap cap,
            # optional Firebase (FIREBASE_GOOGLE_SERVICES_B64) — see the script.
            python3 tool/ci_prepare_android.py | tee /tmp/prep.log
            grep -q '^FIREBASE_ON=true' /tmp/prep.log && echo 'export HM_DEFINES="--dart-define=FIREBASE_ON=true"' >> "$BASH_ENV" || true
            flutter pub get
            # Fast feedback: analyzer errors/warnings abort before the ~3 min assemble
            # task. Infos (deprecation nits etc.) are non-fatal — tracked as cleanup.
            flutter analyze --no-fatal-infos || exit 2
            flutter test
      - run:
          name: Assemble debug APK
          working_directory: apps/hrmate_flutter
          command: |
            . "$BASH_ENV"
            flutter build apk --debug ${HM_DEFINES:-}
      - store_artifacts:
          path: apps/hrmate_flutter/build/app/outputs/flutter-apk/app-debug.apk
          destination: HRMate-flutter.apk

  # ── P6: release APK for internal distribution (main only) ──
  # Signed with the upload keystore when HRMATE_KEYSTORE_B64 (+ passwords/alias)
  # are set in CircleCI → Project Settings → Environment Variables; otherwise
  # debug-signed (fine for internal testing, can't later update a Play build).
  # versionCode = CircleCI build number, so every APK installs over the last.
  release-flutter:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium+
    steps:
      - checkout
      - run:
          name: Install Flutter SDK (stable)
          command: |
            if [ ! -d "$HOME/flutter/bin" ]; then
              git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
            fi
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
            . "$BASH_ENV"
            flutter config --no-analytics || true
            flutter --version
      - run:
          name: Generate Android wrapper (release)
          working_directory: apps/hrmate_flutter
          command: |
            . "$BASH_ENV"
            flutter create . --project-name hrmate --org in.flavorflow --platforms=android
            GRADLE_XMX=3g python3 tool/ci_prepare_android.py --release | tee /tmp/prep.log
            grep -q '^FIREBASE_ON=true' /tmp/prep.log && echo 'export HM_DEFINES="--dart-define=FIREBASE_ON=true"' >> "$BASH_ENV" || true
            flutter pub get
      - run:
          name: Build release APK
          working_directory: apps/hrmate_flutter
          no_output_timeout: 30m
          command: |
            . "$BASH_ENV"
            flutter build apk --release --build-number="$CIRCLE_BUILD_NUM" ${HM_DEFINES:-}
      - store_artifacts:
          path: apps/hrmate_flutter/build/app/outputs/flutter-apk/app-release.apk
          destination: HRMate-release.apk
workflows:
  build-deploy:
    jobs:
      - build
      - deploy:
          requires: [build]
          filters:
            branches:
              only: main
      - build-android:
          filters:
            branches:
              only: main
      # Runs on every branch (PR gate) — it only analyzes + assembles a debug APK,
      # never deploys, so feature branches get a green/red check before merge.
      - build-flutter
      - release-flutter:
          requires: [build-flutter]
          filters:
            branches:
              only: main
