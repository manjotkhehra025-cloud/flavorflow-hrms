# CircleCI pipeline: build → deploy to GCP VPS on every push to main.
#
# Required project env vars (CircleCI → Project Settings → Environment Variables):
#   VPS_HOST   = external static IP of your GCP VM
#   VPS_USER   = SSH username on the VM (e.g. "deploy" or your gcloud username)
# SSH key: CircleCI → Project Settings → SSH Keys → add the private key whose
# PUBLIC key is in  /home/$VPS_USER/.ssh/authorized_keys  on the VM, and put its
# FINGERPRINT below (replace ADD_YOUR_SSH_KEY_FINGERPRINT_HERE).

version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - restore_cache:
          key: hrms-npm-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: hrms-npm-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx next build
      # Assemble the standalone server bundle the VPS actually runs:
      - run: |
          set -e
          [ -d public ] && cp -r public .next/standalone/public || true
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r prisma .next/standalone/prisma
          mkdir -p .next/standalone/scripts
          cp scripts/start.sh scripts/post-deploy.sh .next/standalone/scripts/
      - persist_to_workspace:
          root: .
          paths: [.next/standalone]

  deploy:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: .
      - add_ssh_keys:
          fingerprints:
            - "SHA256:FM6hR12F1M0wsgOBj/YpWf6NeiOX0inuEqccY8aNBPY"
      - run:
          name: Trust VPS host key
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - run:
          name: Install rsync
          command: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - run:
          name: Sync build to VPS
          command: |
            rsync -az ./.next/standalone/ "$VPS_USER@$VPS_HOST:/tmp/hrms-$CIRCLE_SHA1/"
            ssh "$VPS_USER@$VPS_HOST" "
              set -e
              sudo find /opt/hrms/app -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
              sudo cp -a /tmp/hrms-$CIRCLE_SHA1/. /opt/hrms/app/
              rm -rf /tmp/hrms-$CIRCLE_SHA1
            "
      - run:
          name: Run migrations & restart app
          command: |
            ssh "$VPS_USER@$VPS_HOST" 'sudo bash /opt/hrms/app/scripts/post-deploy.sh'

  # ── Native Android wrapper (Capacitor shell around the live app) ──
  build-android:
    docker:
      - image: cimg/android:2026.08.1-node
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          key: gradle-{{ checksum "android/build.gradle" }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
      - run: npm ci
      - run: npx cap sync android
      - run:
          name: Assemble debug APK
          working_directory: android
          command: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
      - save_cache:
          key: gradle-{{ checksum "android/build.gradle" }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
          paths: [~/.gradle]
      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: HRMate.apk
workflows:
  build-deploy:
    jobs:
      - build
      - deploy:
          requires: [build]
          filters:
            branches:
              only: main
      - build-android:
          filters:
            branches:
              only: main
