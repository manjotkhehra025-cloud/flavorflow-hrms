<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hm-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hm-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- right outer swoosh (emerald) — top-right down to bottom crutch -->
  <path d="M44 6 C57 12 58 30 32 55" fill="none" stroke="url(#hm-a)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- left outer swoosh (deep teal) — top-left down around to same bottom crutch (cradle) -->
  <path d="M21 7 C5 15 6 36 32 55" fill="none" stroke="url(#hm-b)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- person: head -->
  <circle cx="32" cy="25.5" r="4.6" fill="url(#hm-a)"/>
  <!-- person body: heart-V (two arms raised meeting at the crutch) -->
  <path d="M19.5 31.5
           C23 28.6 28.5 28.6 32 32.2
           C35.5 28.6 41 28.6 44.5 31.5
           C42.5 37 37.5 42.5 32 47
           C26.5 42.5 21.5 37 19.5 31.5 Z"
        fill="url(#hm-b)"/>
</svg>
